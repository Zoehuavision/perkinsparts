<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perkins 发动机零件号查询手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F5;
  --panel:#FFFFFF;
  --ink:#1C2024;
  --ink-soft:#5B6168;
  --line:#E6E2D8;
  --line-soft:#EFEBE1;
  --steel:#2E4A63;
  --steel-deep:#213748;
  --brass:#A9762F;
  --brass-soft:#F3E7D2;
  --chip:#F2F1EC;
  --ok:#3E7A52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:22px 28px 18px;
}
.brand{display:flex; align-items:baseline; gap:12px; margin-bottom:16px;}
.brand .mark{
  width:34px; height:34px; border-radius:7px; background:var(--steel);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px; font-family:'IBM Plex Mono',monospace;
  flex-shrink:0;
}
.brand h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em;}
.brand p{margin:0; font-size:12.5px; color:var(--ink-soft);}

.searchbar{
  display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; max-width:640px;
}
.searchbar svg{flex-shrink:0; opacity:0.45;}
.searchbar input{
  border:none; outline:none; background:transparent; flex:1;
  font-size:14.5px; color:var(--ink); font-family:inherit;
}
.searchbar input::placeholder{color:#9CA0A6;}
.searchbar .clear{
  border:none; background:none; color:var(--ink-soft); cursor:pointer;
  font-size:13px; padding:2px 6px; display:none;
}
.hint{margin-top:8px; font-size:12px; color:var(--ink-soft); max-width:640px;}
.hint b{color:var(--steel); font-weight:600;}

.layout{display:flex; min-height:calc(100vh - 128px);}
aside{
  width:230px; flex-shrink:0; border-right:1px solid var(--line);
  padding:18px 12px; overflow-y:auto;
}
aside .label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); padding:6px 10px 10px;}
.model-btn{
  display:flex; justify-content:space-between; align-items:center;
  width:100%; text-align:left; background:none; border:none; cursor:pointer;
  padding:8px 10px; border-radius:7px; font-size:13.5px; color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-weight:500;
}
.model-btn:hover{background:var(--chip);}
.model-btn.active{background:var(--steel); color:#fff;}
.model-btn .n{font-size:10.5px; color:var(--ink-soft); font-family:'Inter',sans-serif;}
.model-btn.active .n{color:#CBD8E2;}
.model-btn.all{font-family:'Inter',sans-serif; font-weight:600;}

main{flex:1; padding:22px 28px 60px; min-width:0;}
.results-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; flex-wrap:wrap; gap:10px;
}
.results-head h2{font-size:16px; margin:0; font-weight:600;}
.results-head .count{color:var(--ink-soft); font-weight:400; font-size:13px;}
.copy-all{
  display:flex; align-items:center; gap:7px;
  background:var(--steel); color:#fff; border:none; border-radius:8px;
  padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:'Inter',sans-serif;
}
.copy-all:hover{background:var(--steel-deep);}
.copy-all.done{background:var(--ok);}

.cards{display:flex; flex-direction:column; gap:10px;}
.card{
  background:var(--panel); border:1px solid var(--line-soft); border-radius:10px;
  padding:15px 17px;
}
.card-top{display:flex; justify-content:space-between; gap:14px; align-items:flex-start; margin-bottom:9px;}
.card-name{font-size:14.5px; font-weight:600;}
.card-name .zh{color:var(--ink-soft); font-weight:400; font-size:13px; margin-left:6px;}
.card-models{margin-top:5px; display:flex; flex-wrap:wrap; gap:5px;}
.tag{
  font-size:11px; font-family:'IBM Plex Mono',monospace; background:var(--chip);
  color:var(--steel-deep); padding:2px 7px; border-radius:5px; cursor:pointer;
}
.tag:hover{background:var(--brass-soft); color:var(--brass);}
.pns{display:flex; flex-wrap:wrap; gap:7px; margin:9px 0 6px;}
.pn{
  display:flex; align-items:center; gap:7px;
  background:var(--paper); border:1px solid var(--line); border-radius:7px;
  padding:6px 10px; font-size:13px; font-family:'IBM Plex Mono',monospace; font-weight:600;
  cursor:pointer;
}
.pn:hover{border-color:var(--brass); color:var(--brass);}
.pn svg{opacity:0.5; flex-shrink:0;}
.pn.copied{background:#EAF4EC; border-color:var(--ok); color:var(--ok);}
.note{font-size:12px; color:var(--ink-soft); line-height:1.5; margin-top:4px;}
.empty{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

.toast{
  position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--steel-deep); color:#fff; padding:10px 18px; border-radius:8px;
  font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}

@media (max-width:760px){
  .layout{flex-direction:column;}
  aside{width:100%; border-right:none; border-bottom:1px solid var(--line); max-height:180px;}
  header{padding:18px 16px 14px;}
  main{padding:16px 16px 50px;}
}
</style>
</head>

    </div>

  </main>
</div>

const INDEX_MODELS = ["403", "404", "404C-22", "404D-22", "1004.4", "1006.6", "1006.6T", "1103", "1103T", "1104", "1104D-E44TA", "1106", "1106C-70TA", "1106D", "3.152", "4.236", "4.248", "4.203"];

const cardsEl = document.getElementById('cards');
const modelListEl = document.getElementById('modelList');
const resultsTitle = document.getElementById('resultsTitle');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const copyAllBtn = document.getElementById('copyAllBtn');
const copyAllLabel = document.getElementById('copyAllLabel');
const toastEl = document.getElementById('toast');

let activeModel = '';

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

function copyText(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{});
  }
  document.body.removeChild(ta);
}

// build model counts
const modelCounts = {};
PARTS.forEach(p => p.models.forEach(m => { modelCounts[m] = (modelCounts[m]||0) + p.pns.length; }));
document.getElementById('allCount').textContent = PARTS.reduce((a,p)=>a+p.pns.length,0);

INDEX_MODELS.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'model-btn';
  btn.dataset.model = m;
  btn.innerHTML = m + ' <span class="n">' + (modelCounts[m]||0) + '</span>';
  btn.addEventListener('click', () => {
    activeModel = m;
    searchEl.value = '';
    render();
  });
  modelListEl.appendChild(btn);
});

function setActiveModelButton(){
  document.querySelectorAll('.model-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.model === activeModel);
  });
}

function matchQuery(p, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(p.models.some(m => m.toLowerCase().includes(q))) return true;
  if(p.nameEn.toLowerCase().includes(q)) return true;
  if(p.nameZh.includes(q)) return true;
  if(p.pns.some(pn => pn.toLowerCase().includes(q))) return true;
  if(p.note.toLowerCase().includes(q)) return true;
  return false;
}

function render(){
  setActiveModelButton();
  const q = searchEl.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  let filtered = PARTS.filter(p => {
    const modelOk = activeModel ? p.models.includes(activeModel) : true;
    return modelOk && matchQuery(p, q);
  });

  // header + copy-all button
  if(activeModel && !q){
    resultsTitle.innerHTML = activeModel + ' <span class="count">共 ' + filtered.reduce((a,p)=>a+p.pns.length,0) + ' 个零件号</span>';
    copyAllBtn.style.display = 'flex';
    copyAllLabel.textContent = '复制 ' + activeModel + ' 全部零件号';
    copyAllBtn.onclick = () => {
      const lines = filtered.map(p => {
        const name = p.nameEn + (p.nameZh ? ' / ' + p.nameZh : '');
        return name + '：' + p.pns.join(' / ');
      });
      const totalPns = filtered.reduce((a,p)=>a+p.pns.length,0);
      copyText(lines.join('\n'));
      copyAllBtn.classList.add('done');
      copyAllLabel.textContent = '已复制 ' + totalPns + ' 个零件号 ✓';
      showToast('已复制 ' + activeModel + ' 全部配件（含品名）到剪贴板');
      setTimeout(()=>{ copyAllBtn.classList.remove('done'); copyAllLabel.textContent = '复制 ' + activeModel + ' 全部零件号'; }, 2000);
    };
  } else if(q){
    resultsTitle.innerHTML = '搜索 “' + q + '” <span class="count">' + filtered.length + ' 条结果</span>';
    copyAllBtn.style.display = 'none';
  } else {
    resultsTitle.innerHTML = '全部配件 <span class="count">' + filtered.length + ' 条记录</span>';
    copyAllBtn.style.display = 'none';
  }

  cardsEl.innerHTML = '';
  if(filtered.length === 0){
    cardsEl.innerHTML = '<div class="empty">未找到匹配结果，请尝试其他零件号 / 型号 / 关键字</div>';
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const modelsHtml = p.models.map(m => '<span class="tag" data-m="' + m + '">' + m + '</span>').join('');
    const pnsHtml = p.pns.map(pn =>
      '<span class="pn" data-pn="' + pn + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' + pn + '</span>'
    ).join('');
    card.innerHTML =
      '<div class="card-top"><div>' +
        '<span class="card-name">' + p.nameEn + (p.nameZh ? '<span class="zh">' + p.nameZh + '</span>' : '') + '</span>' +
        '<div class="card-models">' + modelsHtml + '</div>' +
      '</div></div>' +
      '<div class="pns">' + pnsHtml + '</div>' +
      (p.note ? '<div class="note">' + p.note + '</div>' : '');
    cardsEl.appendChild(card);
  });

  cardsEl.querySelectorAll('.pn').forEach(el => {
    el.addEventListener('click', () => {
      copyText(el.dataset.pn);
      el.classList.add('copied');
      showToast('已复制零件号 ' + el.dataset.pn);
      setTimeout(()=>el.classList.remove('copied'), 1200);
    });
  });
  cardsEl.querySelectorAll('.tag').forEach(el => {
    el.addEventListener('click', () => {
      activeModel = el.dataset.m;
      searchEl.value = '';
      render();
    });
  });
}

searchEl.addEventListener('input', () => { activeModel=''; render(); });
clearBtn.addEventListener('click', () => { searchEl.value=''; render(); searchEl.focus(); });

render();
</script>
